<!doctype html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>404 — Mukunda Rao Katta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { color-scheme: dark; }
    body {
      position: relative;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
      background: #000;
      color: #e2e8f0;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    /* Ambient depth */
    .mesh {
      position: fixed; inset: 0; pointer-events: none;
      background:
        radial-gradient(ellipse at 30% 30%, rgba(99,102,241,0.20), transparent 55%),
        radial-gradient(ellipse at 70% 70%, rgba(34,211,238,0.12), transparent 55%);
    }
    .grid {
      position: fixed; inset: 0; pointer-events: none; opacity: 0.5;
      background-image:
        linear-gradient(to right, rgba(129,140,248,0.06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(129,140,248,0.06) 1px, transparent 1px);
      background-size: 56px 56px;
      mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%);
    }
    .container {
      position: relative;
      max-width: 460px;
      animation: rise 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }
    .mono {
      font-size: 0.7rem; letter-spacing: 0.4em; text-transform: uppercase;
      color: #818cf8; margin-bottom: 1.25rem; font-weight: 600;
    }
    .code {
      font-size: clamp(5rem, 18vw, 8rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #818cf8 0%, #a78bfa 40%, #22d3ee 100%);
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.75rem;
      animation: shimmer 7s ease-in-out infinite;
    }
    h1 { font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 0.75rem; color: #fff; }
    p { font-size: 0.9rem; color: #94a3b8; margin-bottom: 2rem; line-height: 1.65; }
    a {
      position: relative;
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.8rem 1.6rem; border-radius: 0.75rem;
      background: linear-gradient(135deg, #6366f1, #a78bfa);
      color: #fff; font-weight: 600; font-size: 0.875rem; text-decoration: none;
      box-shadow: 0 0 0 1px rgba(129,140,248,0.3), 0 14px 40px -12px rgba(99,102,241,0.7);
      transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), box-shadow 0.25s;
    }
    a:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(167,139,250,0.5), 0 20px 50px -10px rgba(99,102,241,0.85); }
    a svg { transition: transform 0.25s; }
    a:hover svg { transform: translateX(-3px); }
    @keyframes shimmer { 0%,100% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } }
    @keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .container { animation: none; }
      .code { animation: none; }
    }
  </style>
</head>
<body>
  <div class="mesh"></div>
  <div class="grid"></div>
  <div class="container">
    <div class="mono">Mukunda Rao Katta</div>
    <div class="code">404</div>
    <h1>Lost in the latent space</h1>
    <p>This route didn't resolve — the page you're looking for doesn't exist or has moved.</p>
    <a href="/">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
      Back to home
    </a>
  </div>
</body>
</html>
