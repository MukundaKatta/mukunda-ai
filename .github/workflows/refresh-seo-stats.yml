name: Refresh SEO Stats

on:
  workflow_dispatch:
  schedule:
    # Same 3-day cadence as the profile-readme refresh, offset by 12h to spread
    # API load and so the two sources update on alternating days when paired.
    - cron: "0 21 */3 * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Refresh SEO numbers in index.html + llms.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/refresh_seo_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/llms.txt
          git diff --cached --quiet || git commit -m "chore: refresh SEO stats (meta description + llms.txt)"
          git push
